name: サイト生成

# 記事やスクリプトを push したら、生成スクリプトを実行して結果をコミットする。
# 手で node .github/scripts/generate-site.js を実行し忘れても反映されるようにするため。
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'about/**'
      - 'index.html'
      - 'assets/**'
      - '.github/scripts/generate-site.js'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成スクリプトを実行する
        run: node .github/scripts/generate-site.js

      - name: 変更があればコミットする
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "生成結果に変更なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "サイト生成を反映（自動）"
          git push
