<svg xmlns="http://www.w3.org/2000/svg" width="720" height="890" viewBox="0 0 720 890" role="img" aria-label="倉庫が1つなら数え方のルールでずれを防げる。楽天・Amazon・自社サイトで売り始めると、倉庫間を移動中の在庫や、注文は入ったがまだ出荷していない在庫が生まれ、数え方のルールだけでは越えられない壁になる">
