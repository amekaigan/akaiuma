  <polygon points="344,340 376,340 376,360 396,360 360,394 324,360 344,360" fill="#A4243B"/>
  <text x="360" y="430" font-size="24" font-weight="700" fill="#1F2328" text-anchor="middle">楽天・Amazon・自社サイトで売り始めると</text>
