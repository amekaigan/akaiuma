<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="会計ソフトを選ぶ3つの基準。口座・カード・決済サービスとの自動連携、青色申告とe-Taxへの対応、無料で試せること">
<rect width="1200" height="630" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="60" y="80" font-size="42" font-weight="700" fill="#1F2328">会計ソフトを選ぶ3つの基準</text>
  <rect x="60" y="104" width="72" height="4" fill="#A4243B"/>

  <!-- 1 自動連携 -->
  <rect x="60" y="146" width="340" height="440" rx="12" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="230" cy="250" r="70" fill="#FBF4F5"/>
  <g fill="none" stroke="#A4243B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="178" y="232" width="62" height="36" rx="18" transform="rotate(-35 209 250)"/>
    <rect x="220" y="232" width="62" height="36" rx="18" transform="rotate(-35 251 250)"/>
  </g>
  <circle cx="98" cy="184" r="22" fill="#A4243B"/>
  <text x="98" y="194" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="230" y="384" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">自動連携</text>
  <text x="230" y="444" font-size="27" fill="#3D444D" text-anchor="middle">口座・カード・</text>
  <text x="230" y="484" font-size="27" fill="#3D444D" text-anchor="middle">決済サービスの</text>
  <text x="230" y="524" font-size="27" fill="#3D444D" text-anchor="middle">明細を取り込める</text>

  <!-- 2 青色申告・e-Tax -->
  <rect x="430" y="146" width="340" height="440" rx="12" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="600" cy="250" r="70" fill="#FBF4F5"/>
  <g fill="none" stroke="#A4243B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M568 204h46l18 18v74h-64Z"/>
    <path d="M582 254l14 14 24-28"/>
  </g>
  <circle cx="468" cy="184" r="22" fill="#A4243B"/>
  <text x="468" y="194" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="600" y="384" font-size="33" font-weight="700" fill="#1F2328" text-anchor="middle">青色申告・e-Tax</text>
  <text x="600" y="444" font-size="27" fill="#3D444D" text-anchor="middle">青色申告と</text>
  <text x="600" y="484" font-size="27" fill="#3D444D" text-anchor="middle">電子申告に</text>
  <text x="600" y="524" font-size="27" fill="#3D444D" text-anchor="middle">対応している</text>

  <!-- 3 無料で試せる -->
  <rect x="800" y="146" width="340" height="440" rx="12" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="970" cy="250" r="70" fill="#FBF4F5"/>
  <g fill="none" stroke="#A4243B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="928" y="212" width="84" height="60" rx="6"/>
    <line x1="950" y1="292" x2="990" y2="292"/>
    <line x1="970" y1="272" x2="970" y2="292"/>
    <path d="M960 232l20 10-20 10Z"/>
  </g>
  <circle cx="838" cy="184" r="22" fill="#A4243B"/>
  <text x="838" y="194" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="970" y="384" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">無料で試せる</text>
  <text x="970" y="444" font-size="27" fill="#3D444D" text-anchor="middle">払う前に</text>
  <text x="970" y="484" font-size="27" fill="#3D444D" text-anchor="middle">画面を触って</text>
  <text x="970" y="524" font-size="27" fill="#3D444D" text-anchor="middle">確かめられる</text>
</g>
</svg>
