  <polygon points="544,522 602.0,488 660,522" fill="#3D444D"/>
  <rect x="552" y="522" width="100" height="56" fill="#FFFFFF" stroke="#3D444D" stroke-width="5"/>
  <rect x="580.0" y="540" width="44.0" height="38" fill="#F4F5F6" stroke="#3D444D" stroke-width="3"/>
  <line x1="580.0" y1="550" x2="624.0" y2="550" stroke="#656C76" stroke-width="2"/>
  <line x1="580.0" y1="560" x2="624.0" y2="560" stroke="#656C76" stroke-width="2"/>
  <line x1="180" y1="556" x2="540" y2="556" stroke="#656C76" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="268" y="508" width="112" height="64" rx="4" fill="#FFFFFF" stroke="#3D444D" stroke-width="4"/>
  <path d="M380 524 h34 l20 22 v26 h-54 z" fill="#FFFFFF" stroke="#3D444D" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="298" cy="578" r="12" fill="#3D444D"/><circle cx="410" cy="578" r="12" fill="#3D444D"/>
