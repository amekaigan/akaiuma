<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-label="タイプ別の選び方。複数の口座や決済サービスを使うならマネーフォワード クラウド、簿記がまったく分からないならfreee会計、困ったときに人に聞きたいならやよいの青色申告 オンライン">
<rect width="720" height="730" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">タイプ別の選び方</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="120" width="640" height="180" rx="12" fill="#FFFFFF" stroke="#A4243B" stroke-width="4"/>
  <text x="72" y="182" font-size="28" fill="#3D444D">複数の口座や決済サービスを使う</text>
  <path d="M76 232h34m-12-12 12 12-12 12" fill="none" stroke="#A4243B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="244" font-size="34" font-weight="700" fill="#A4243B">マネーフォワード クラウド</text>
  <rect x="532" y="102" width="126" height="40" rx="20" fill="#A4243B"/>
  <text x="595" y="130" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">おすすめ</text>
  <rect x="40" y="320" width="640" height="180" rx="12" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="2"/>
  <text x="72" y="382" font-size="28" fill="#3D444D">簿記がまったく分からない</text>
  <path d="M76 432h34m-12-12 12 12-12 12" fill="none" stroke="#A4243B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="444" font-size="34" font-weight="700" fill="#1F2328">freee会計</text>
  <rect x="40" y="520" width="640" height="180" rx="12" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="2"/>
  <text x="72" y="582" font-size="28" fill="#3D444D">困ったときに人に聞きたい</text>
  <path d="M76 632h34m-12-12 12 12-12 12" fill="none" stroke="#A4243B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="644" font-size="34" font-weight="700" fill="#1F2328">やよいの青色申告 オンライン</text>
</g>
</svg>
