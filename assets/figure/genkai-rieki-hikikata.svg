<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-label="モール手数料は売上に率をかけて引く。決済手数料やシステム利用料など。送料・梱包費・倉庫手数料は1個あたりの実額で引く。サイズや重量で決まり、FBAの配送代行手数料もこちら。手数料表に配送の実費は含まれない">
<rect width="720" height="680" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">手数料と送料は、引き方が違う</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="124" width="640" height="220" rx="12" fill="#F4F5F6"/>
  <text x="72" y="178" font-size="28" font-weight="700" fill="#3D444D">モール手数料</text>
  <text x="72" y="232" font-size="34" font-weight="700" fill="#A4243B">売上 × 率で引く</text>
  <text x="72" y="280" font-size="26" font-weight="400" fill="#3D444D">決済手数料・システム利用料など</text>
  <text x="72" y="320" font-size="24" font-weight="400" fill="#656C76">公式の手数料表に並ぶのはこちら</text>
  <rect x="40" y="368" width="640" height="220" rx="12" fill="#FBF4F5"/>
  <text x="72" y="422" font-size="28" font-weight="700" fill="#3D444D">送料・梱包費・倉庫手数料</text>
  <text x="72" y="476" font-size="34" font-weight="700" fill="#A4243B">1個あたりの実額で引く</text>
  <text x="72" y="524" font-size="26" font-weight="400" fill="#3D444D">サイズや重量で決まる</text>
  <text x="72" y="564" font-size="24" font-weight="400" fill="#656C76">FBAの配送代行手数料もこちら</text>
  <text x="40" y="644" font-size="28" font-weight="700" fill="#1F2328">手数料表に、配送の実費は含まれない</text>
</g>
</svg>
