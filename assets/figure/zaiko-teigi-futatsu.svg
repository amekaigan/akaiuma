<svg xmlns="http://www.w3.org/2000/svg" width="720" height="716" viewBox="0 0 720 716" role="img" aria-label="在庫には2つの数字がある。実在庫は倉庫に実際にある数で、棚卸しで数えるのはこちら。帳簿在庫はExcelやシステムの数字で、入力した瞬間に変わり、入力を忘れると遅れて変わる。動くタイミングが違うので、どこかで離れていく">
<rect width="720" height="716" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">在庫には、2つの数字がある</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="124" width="640" height="210" rx="12" fill="#F4F5F6" stroke="#3D444D" stroke-width="3"/>
  <text x="72" y="180" font-size="34" font-weight="700" fill="#3D444D">実在庫</text>
  <text x="190" y="180" font-size="26" font-weight="400" fill="#3D444D">倉庫に実際にある数</text>
  <text x="72" y="234" font-size="26" font-weight="400" fill="#1F2328">・棚や箱の中に、物としてある</text>
  <text x="72" y="276" font-size="26" font-weight="400" fill="#1F2328">・棚卸しで数えるのはこちら</text>
  <text x="360" y="394" font-size="44" font-weight="700" fill="#A4243B" text-anchor="middle">≠</text>
  <rect x="40" y="414" width="640" height="210" rx="12" fill="#FBF4F5" stroke="#A4243B" stroke-width="3"/>
  <text x="72" y="470" font-size="34" font-weight="700" fill="#A4243B">帳簿在庫</text>
  <text x="224" y="470" font-size="26" font-weight="400" fill="#3D444D">Excelやシステムの数字</text>
  <text x="72" y="524" font-size="26" font-weight="400" fill="#1F2328">・入力した瞬間に変わる</text>
  <text x="72" y="566" font-size="26" font-weight="400" fill="#1F2328">・入力を忘れると遅れて変わる</text>
  <text x="40" y="682" font-size="26" font-weight="700" fill="#1F2328">動くタイミングが違うので、どこかで離れていく</text>
</g>
</svg>
