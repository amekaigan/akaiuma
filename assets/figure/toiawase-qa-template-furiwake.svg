<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-label="届いた問い合わせを1通ずつ、型にできるか、Q&amp;Aに載せるか、商品ページを直すかの3つに振り分ける">
<rect width="720" height="580" fill="#FFFFFF"/>
<g font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
<rect x="44" y="52" width="470" height="22" rx="11" fill="#EDB7BF"/>
<text x="40" y="66" font-size="34" font-weight="700" fill="#1F2328">問い合わせを3つに振り分ける</text>
<rect fill="#EDB7BF" transform="translate(6 -4)" x="300" y="120" width="120" height="80" rx="4"/>
<rect x="300" y="120" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path fill="none" d="M304 126 L360.0 164.0 L416 126" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path fill="none" d="M360 214 V250 M140 250 H580 M140 250 V286 M360 250 V286 M580 250 V286" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<rect fill="#DCDFE3" transform="translate(7 -5)" x="35" y="296" width="210" height="150" rx="16"/>
<rect x="35" y="296" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="140" y="360" font-size="26" font-weight="700" fill="#1F2328" text-anchor="middle">型にできるか</text>
<text x="140" y="404" font-size="22" font-weight="400" fill="#656C76" text-anchor="middle">テンプレートへ</text>
<rect fill="#DCDFE3" transform="translate(7 -5)" x="255" y="296" width="210" height="150" rx="16"/>
<rect x="255" y="296" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="360" y="360" font-size="25" font-weight="700" fill="#1F2328" text-anchor="middle">Q&amp;Aに載せるか</text>
<text x="360" y="404" font-size="22" font-weight="400" fill="#656C76" text-anchor="middle">質問する前の人へ</text>
<rect fill="#EDB7BF" transform="translate(7 -5)" x="475" y="296" width="210" height="150" rx="16"/>
<rect x="475" y="296" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="580" y="360" font-size="26" font-weight="700" fill="#1F2328" text-anchor="middle">ページを直すか</text>
<text x="580" y="404" font-size="22" font-weight="400" fill="#656C76" text-anchor="middle">説明文や画像へ</text>
<text x="360" y="510" font-size="24" font-weight="400" fill="#656C76" text-anchor="middle">振り分けるだけでいい。</text>
<text x="360" y="546" font-size="24" font-weight="400" fill="#656C76" text-anchor="middle">数日続けると、同じ種類が集まる場所が見えてくる</text>
</g>
</svg>
