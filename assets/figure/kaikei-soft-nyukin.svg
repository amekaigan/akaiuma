<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-label="売上から手数料が差し引かれて入金されるため、売上と手数料を分けて記録しないと帳簿と入金額が合わないことを示す図">
<rect width="720" height="690" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">帳簿と入金額が合わない理由</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <text x="40" y="150" font-size="28" font-weight="700" fill="#3D444D">注文の合計</text>
  <rect x="40" y="168" width="640" height="92" rx="10" fill="#F4F5F6" stroke="#C9CDD3" stroke-width="2"/>
  <text x="360" y="228" font-size="38" font-weight="700" fill="#1F2328" text-anchor="middle">売上</text>
  <line x1="510" y1="260" x2="510" y2="330" stroke="#656C76" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="40" y="312" font-size="28" font-weight="700" fill="#3D444D">口座に届くお金</text>
  <rect x="40" y="330" width="460" height="92" rx="10" fill="#A4243B"/>
  <text x="270" y="390" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">入金額</text>
  <rect x="520" y="330" width="160" height="92" rx="10" fill="#FFFFFF" stroke="#656C76" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="600" y="372" font-size="26" font-weight="700" fill="#3D444D" text-anchor="middle">手数料など</text>
  <text x="600" y="406" font-size="24" fill="#656C76" text-anchor="middle">引かれる</text>
  <rect x="40" y="466" width="640" height="104" rx="12" fill="#FBF4F5"/>
  <text x="360" y="532" font-size="40" font-weight="700" fill="#1F2328" text-anchor="middle">売上 − 手数料 ＝ 入金額</text>
  <text x="360" y="622" font-size="28" fill="#3D444D" text-anchor="middle">帳簿には、売上と手数料を</text>
  <text x="360" y="662" font-size="28" fill="#3D444D" text-anchor="middle">分けて記録する</text>
</g>
</svg>
