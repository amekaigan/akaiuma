<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710" role="img" aria-label="FBAで在庫管理が楽になるかの判断。在庫管理が人の判断や記憶に頼っている場合は、ズレの原因を追う作業が減り、効果は大きい。バーコードで一貫して運用できている場合は在庫管理の恩恵は小さく、期待するのは受注から出荷が手から離れること">
<rect width="720" height="710" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="34" font-weight="700" fill="#1F2328">FBAで在庫管理が楽になるか</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="120" width="640" height="104" rx="12" fill="#3D444D"/>
  <text x="360" y="164" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">いまの在庫管理は</text>
  <text x="360" y="202" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">人の判断や記憶に頼っている？</text>
  <path d="M360 224 V252" stroke="#656C76" stroke-width="4"/><path d="M350 248 l10 14 10 -14" fill="#656C76"/>
  <rect x="40" y="270" width="640" height="190" rx="12" fill="#FBF4F5" stroke="#A4243B" stroke-width="3"/>
  <text x="72" y="320" font-size="28" font-weight="700" fill="#A4243B">頼っている（Excel・目視）</text>
  <text x="72" y="370" font-size="28" font-weight="700" fill="#1F2328">在庫管理が楽になる効果は大きい</text>
  <text x="72" y="414" font-size="26" font-weight="400" fill="#3D444D">ズレの原因を追う作業が減る</text>
  <rect x="40" y="484" width="640" height="190" rx="12" fill="#F4F5F6" stroke="#656C76" stroke-width="3"/>
  <text x="72" y="534" font-size="28" font-weight="700" fill="#3D444D">頼っていない（バーコードで一貫）</text>
  <text x="72" y="584" font-size="28" font-weight="700" fill="#1F2328">在庫管理の恩恵は小さい</text>
  <text x="72" y="628" font-size="24" font-weight="400" fill="#3D444D">期待するのは、受注から出荷が手から離れること</text>
</g>
</svg>
