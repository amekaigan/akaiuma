<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710" role="img" aria-label="限界利益を出す順番。税込3,300円を税抜の3,000円にし、仕入れ原価1,200円を引いて粗利1,800円、モール手数料15%の450円を引いて1,350円、送料・梱包費など700円を引いて限界利益650円（約21.7%）になる">
<rect width="720" height="710" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">限界利益を出す順番</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <text x="40" y="158" font-size="27" font-weight="700" fill="#3D444D">① 税込3,300円を税抜にする</text>
  <rect x="40" y="176" width="640.0" height="56" rx="6" fill="#3D444D"/>
  <text x="58" y="214" font-size="28" font-weight="700" fill="#FFFFFF">3,000円</text>
  <text x="40" y="286" font-size="27" font-weight="700" fill="#3D444D">② 仕入れ原価 1,200円を引く</text>
  <rect x="424.0" y="304" width="256.0" height="56" rx="6" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="40" y="304" width="384.0" height="56" rx="6" fill="#3D444D"/>
  <text x="58" y="342" font-size="28" font-weight="700" fill="#FFFFFF">粗利 1,800円</text>
  <text x="40" y="414" font-size="27" font-weight="700" fill="#3D444D">③ モール手数料 15%（450円）を引く</text>
  <rect x="328.0" y="432" width="352.0" height="56" rx="6" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="40" y="432" width="288.0" height="56" rx="6" fill="#3D444D"/>
  <text x="58" y="470" font-size="28" font-weight="700" fill="#FFFFFF">1,350円</text>
  <text x="40" y="542" font-size="27" font-weight="700" fill="#3D444D">④ 送料・梱包費など 700円を引く</text>
  <rect x="178.7" y="560" width="501.3" height="56" rx="6" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="40" y="560" width="138.7" height="56" rx="6" fill="#A4243B"/>
  <text x="58" y="598" font-size="28" font-weight="700" fill="#FFFFFF">650円</text>
  <text x="206.66666666666669" y="598" font-size="28" font-weight="700" fill="#A4243B">＝ 限界利益（約21.7%）</text>
  <text x="40" y="676" font-size="24" font-weight="400" fill="#656C76">※ 計算の流れを示す仮の数字です</text>
</g>
</svg>
