<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-label="仮の例。新規の1回目だけで見た広告費の上限は約500円、平均購入回数1.4回を入れると約700円。どちらも利益がゼロになる地点">
<rect width="720" height="620" fill="#FFFFFF"/>
<g font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
<rect x="44" y="52" width="520" height="22" rx="11" fill="#EDB7BF"/>
<text x="40" y="66" font-size="34" font-weight="700" fill="#1F2328">リピートで上限が変わる（仮の例）</text>
<text x="40" y="170" font-size="26" font-weight="700" fill="#1F2328">新規1回だけ</text>
<rect fill="#DCDFE3" transform="translate(7 -5)" x="40" y="190" width="360.0" height="56" rx="10"/>
<rect fill="none" x="40" y="190" width="360.0" height="56" rx="10" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="418.0" y="230" font-size="28" font-weight="700" fill="#1F2328">約500円</text>
<text x="40" y="320" font-size="26" font-weight="700" fill="#1F2328">リピート込み</text>
<rect fill="#EDB7BF" transform="translate(7 -5)" x="40" y="340" width="504.0" height="56" rx="10"/>
<rect fill="none" x="40" y="340" width="504.0" height="56" rx="10" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="562.0" y="380" font-size="28" font-weight="700" fill="#1F2328">約700円</text>
<path fill="none" d="M400 180 V420" stroke="#A4243B" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>
<path fill="none" d="M544 330 V420" stroke="#A4243B" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>
<text x="520" y="470" font-size="24" font-weight="700" fill="#A4243B" text-anchor="middle">どちらも「利益がゼロになる地点」</text>
<text x="40" y="540" font-size="24" font-weight="400" fill="#656C76">1人あたりの限界利益 650円 × 1.4回 ＝ 910円</text>
<text x="40" y="578" font-size="24" font-weight="400" fill="#656C76">固定費 150円 × 1.4回 ＝ 210円を引いて 700円</text>
</g>
</svg>
