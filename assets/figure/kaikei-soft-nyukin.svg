<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="売上から手数料が差し引かれて入金されるため、売上と手数料を分けて記録しないと帳簿と入金額が合わないことを示す図">
<rect width="1200" height="630" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="60" y="80" font-size="42" font-weight="700" fill="#1F2328">帳簿と入金額が合わない理由</text>
  <rect x="60" y="104" width="72" height="4" fill="#A4243B"/>

  <!-- 売上 -->
  <text x="60" y="186" font-size="30" font-weight="700" fill="#3D444D">注文の合計</text>
  <rect x="60" y="206" width="1080" height="96" rx="10" fill="#F4F5F6" stroke="#C9CDD3" stroke-width="2"/>
  <text x="600" y="268" font-size="40" font-weight="700" fill="#1F2328" text-anchor="middle">売上</text>

  <!-- 区切りの点線 -->
  <line x1="860" y1="302" x2="860" y2="352" stroke="#656C76" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- 入金額と手数料 -->
  <text x="60" y="344" font-size="30" font-weight="700" fill="#3D444D">口座に届くお金</text>
  <rect x="60" y="364" width="790" height="96" rx="10" fill="#A4243B"/>
  <text x="455" y="426" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">入金額</text>
  <rect x="870" y="364" width="270" height="96" rx="10" fill="#FFFFFF" stroke="#656C76" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1005" y="410" font-size="30" font-weight="700" fill="#3D444D" text-anchor="middle">手数料など</text>
  <text x="1005" y="446" font-size="24" fill="#656C76" text-anchor="middle">引かれて届かない</text>

  <!-- 式 -->
  <text x="600" y="538" font-size="48" font-weight="700" fill="#1F2328" text-anchor="middle">売上 − 手数料 ＝ 入金額</text>
  <text x="600" y="588" font-size="28" fill="#656C76" text-anchor="middle">帳簿には、売上と手数料を分けて記録する</text>
</g>
</svg>
