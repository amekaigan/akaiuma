<text x="150" y="442" font-size="24" font-weight="400" fill="#1F2328">合算する</text>
<rect fill="none" x="370" y="406" width="258" height="54" rx="27" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect fill="none" x="392" y="422" width="22" height="22" rx="4" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="428" y="442" font-size="24" font-weight="400" fill="#1F2328">分けて数える</text>
