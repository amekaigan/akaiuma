<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-label="注文日、発送日、入金日がそれぞれ違う日になるため、いつの売上かを整理する必要があることを示す図">
<rect width="720" height="600" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">売れた日と入金日はずれる</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <circle cx="130" cy="210" r="62" fill="#FFFFFF" stroke="#A4243B" stroke-width="5"/>
  <text x="130" y="222" font-size="32" font-weight="700" fill="#A4243B" text-anchor="middle">注文日</text>
  <text x="130" y="326" font-size="26" fill="#3D444D" text-anchor="middle">お客さまが</text>
  <text x="130" y="362" font-size="26" fill="#3D444D" text-anchor="middle">注文する</text>
  <circle cx="360" cy="210" r="62" fill="#FFFFFF" stroke="#A4243B" stroke-width="5"/>
  <text x="360" y="222" font-size="32" font-weight="700" fill="#A4243B" text-anchor="middle">発送日</text>
  <text x="360" y="326" font-size="26" fill="#3D444D" text-anchor="middle">商品を</text>
  <text x="360" y="362" font-size="26" fill="#3D444D" text-anchor="middle">送る</text>
  <circle cx="590" cy="210" r="62" fill="#A4243B" stroke="#A4243B" stroke-width="5"/>
  <text x="590" y="222" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">入金日</text>
  <text x="590" y="326" font-size="26" fill="#3D444D" text-anchor="middle">口座に</text>
  <text x="590" y="362" font-size="26" fill="#3D444D" text-anchor="middle">お金が届く</text>
  <path d="M205 210h66m-16-16 16 16-16 16" fill="none" stroke="#656C76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M435 210h66m-16-16 16 16-16 16" fill="none" stroke="#656C76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="410" width="640" height="150" rx="12" fill="#F4F5F6"/>
  <text x="360" y="474" font-size="32" font-weight="700" fill="#1F2328" text-anchor="middle">3つの日付がバラバラなので</text>
  <text x="360" y="524" font-size="32" font-weight="700" fill="#A4243B" text-anchor="middle">「いつの売上か」を整理する</text>
</g>
</svg>
