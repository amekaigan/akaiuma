<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-label="在庫の問題は2階建て。1階は数字がずれる問題で、原因は在庫の定義が決まっていないこと。2階は数字が合っていても判断できない問題で、原因は情報が共有されていないこと。どちらもExcelの問題ではない">
<rect width="720" height="690" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">在庫の問題は2階建て</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <path d="M40 210 L360 120 L680 210 Z" fill="#A4243B"/>
  <rect x="64" y="210" width="592" height="190" fill="#FBF4F5" stroke="#A4243B" stroke-width="4"/>
  <rect x="64" y="210" width="92" height="190" fill="#A4243B"/>
  <text x="110" y="320" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2階</text>
  <text x="184" y="268" font-size="28" font-weight="700" fill="#1F2328">数字が合っていても</text>
  <text x="184" y="308" font-size="28" font-weight="700" fill="#1F2328">判断できない</text>
  <text x="184" y="360" font-size="26" font-weight="400" fill="#3D444D">情報が共有されていない</text>
  <rect x="64" y="400" width="592" height="190" fill="#F4F5F6" stroke="#3D444D" stroke-width="4"/>
  <rect x="64" y="400" width="92" height="190" fill="#3D444D"/>
  <text x="110" y="510" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1階</text>
  <text x="184" y="476" font-size="28" font-weight="700" fill="#1F2328">数字がずれる</text>
  <text x="184" y="528" font-size="26" font-weight="400" fill="#3D444D">在庫の定義が</text>
  <text x="184" y="564" font-size="26" font-weight="400" fill="#3D444D">決まっていない</text>
  <rect x="40" y="590" width="640" height="10" fill="#3D444D"/>
  <text x="40" y="656" font-size="28" font-weight="700" fill="#A4243B">どちらも、Excelの問題ではない</text>
</g>
</svg>
