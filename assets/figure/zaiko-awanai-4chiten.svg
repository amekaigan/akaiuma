<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" role="img" aria-label="在庫のずれが生まれる4つの地点。倉庫間の移動中は、送ってから反映されるまでどちらの在庫でもない。引き当て済みは、棚にはあるが売り物としては既にない。梱包済みは、棚にはないがまだ倉庫から出ていない。FBAの返品処理中は、検品の結果で在庫に戻るかが決まる">
<rect width="720" height="740" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">ずれが生まれる4つの地点</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="124" width="640" height="118" rx="12" fill="#F4F5F6"/>
  <circle cx="92" cy="183" r="30" fill="#A4243B"/>
  <text x="92" y="194" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="146" y="168" font-size="28" font-weight="700" fill="#1F2328">倉庫間の移動中</text>
  <text x="146" y="204" font-size="24" font-weight="400" fill="#3D444D">送ってから反映されるまで、</text>
  <text x="146" y="232" font-size="24" font-weight="400" fill="#3D444D">どちらの在庫でもない</text>
  <rect x="40" y="260" width="640" height="118" rx="12" fill="#F4F5F6"/>
  <circle cx="92" cy="319" r="30" fill="#A4243B"/>
  <text x="92" y="330" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="146" y="304" font-size="28" font-weight="700" fill="#1F2328">引き当て済み</text>
  <text x="146" y="340" font-size="24" font-weight="400" fill="#3D444D">棚にはあるが、</text>
  <text x="146" y="368" font-size="24" font-weight="400" fill="#3D444D">売り物としては既にない</text>
  <rect x="40" y="396" width="640" height="118" rx="12" fill="#F4F5F6"/>
  <circle cx="92" cy="455" r="30" fill="#A4243B"/>
  <text x="92" y="466" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="146" y="440" font-size="28" font-weight="700" fill="#1F2328">梱包済み</text>
  <text x="146" y="476" font-size="24" font-weight="400" fill="#3D444D">棚にはないが、</text>
  <text x="146" y="504" font-size="24" font-weight="400" fill="#3D444D">まだ倉庫から出ていない</text>
  <rect x="40" y="532" width="640" height="118" rx="12" fill="#F4F5F6"/>
  <circle cx="92" cy="591" r="30" fill="#A4243B"/>
  <text x="92" y="602" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="146" y="576" font-size="28" font-weight="700" fill="#1F2328">FBAの返品処理中</text>
  <text x="146" y="612" font-size="24" font-weight="400" fill="#3D444D">検品の結果で、</text>
  <text x="146" y="640" font-size="24" font-weight="400" fill="#3D444D">在庫に戻るかが決まる</text>
  <text x="40" y="708" font-size="28" font-weight="700" fill="#A4243B">1つでもルールがないと、棚卸しでずれる</text>
</g>
</svg>
