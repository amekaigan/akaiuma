<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-label="会計ソフトを始める前の3ステップ。開業届を出す、青色申告の承認申請をする、事業用の口座とカードを分ける">
<rect width="720" height="800" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">始める前の3ステップ</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="120" width="640" height="165" rx="12" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="110" cy="202" r="38" fill="#A4243B"/>
  <text x="110" y="216.4" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="176" y="194" font-size="34" font-weight="700" fill="#1F2328">開業届を出す</text>
  <text x="176" y="240" font-size="26" fill="#3D444D">事業を始めたら、税務署に提出</text>
  <path d="M360 294v28m-14-14 14 14 14-14" fill="none" stroke="#A4243B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="335" width="640" height="165" rx="12" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="110" cy="417" r="38" fill="#A4243B"/>
  <text x="110" y="431.4" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="176" y="409" font-size="34" font-weight="700" fill="#1F2328">青色申告の承認申請</text>
  <text x="176" y="455" font-size="26" fill="#3D444D">提出期限があるので、早めに出す</text>
  <path d="M360 509v28m-14-14 14 14 14-14" fill="none" stroke="#A4243B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="550" width="640" height="165" rx="12" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="110" cy="632" r="38" fill="#A4243B"/>
  <text x="110" y="646.4" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="176" y="624" font-size="34" font-weight="700" fill="#1F2328">口座とカードを分ける</text>
  <text x="176" y="670" font-size="26" fill="#3D444D">事業専用を用意して、ソフトに連携</text>
  <text x="40" y="775" font-size="24" fill="#656C76">期限や手続きの詳細は、国税庁のサイトや税務署で確認</text>
</g>
</svg>
