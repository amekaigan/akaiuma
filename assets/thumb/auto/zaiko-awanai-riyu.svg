<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="年間1万件出荷して分かった、在庫が合わない本当の理由">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="16" height="630" fill="#A4243B"/>
  <g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
    <text x="96" y="118" font-size="30" font-weight="700" fill="#A4243B" letter-spacing="2">在庫管理</text>
    <text x="96" y="196" font-size="74" font-weight="700" fill="#1F2328">年間1万件出荷して分かった</text>
    <text x="96" y="304" font-size="74" font-weight="700" fill="#1F2328">在庫が合わない本当の理由</text>
    <text x="96" y="548" font-size="30" font-weight="700" fill="#1F2328" letter-spacing="3">あかいうま</text>
    <text x="96" y="586" font-size="23" fill="#656C76">物販の売上アップと業務効率化</text>
  </g>
  <rect x="96" y="500" width="72" height="4" fill="#A4243B"/>
</svg>
