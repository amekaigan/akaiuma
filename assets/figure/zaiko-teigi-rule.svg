<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-label="紙1枚の数え方のルール。セット商品は1セットで1個かパーツごとか、色違い・サイズ違いは合算するか分けて数えるか、検品前の入荷品は届いた時点か検品のあとか、預け先で紛失中の在庫はあると数えるかないと数えるか。正解はなく、自分の店の答えを1つ決める">
<rect width="720" height="830" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">先に決めておく4つのこと</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="68" y="132" width="600" height="604" rx="6" fill="#F4F5F6"/>
  <rect x="60" y="124" width="600" height="604" rx="6" fill="#FFFFFF" stroke="#3D444D" stroke-width="3"/>
  <text x="90" y="180" font-size="30" font-weight="700" fill="#1F2328">数え方のルール</text>
  <line x1="90" y1="200" x2="630" y2="200" stroke="#656C76" stroke-width="1.5"/>
  <text x="90" y="252" font-size="26" font-weight="700" fill="#1F2328">セット商品</text>
  <rect x="90" y="270" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="112" y="285" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="148" y="305" font-size="24" font-weight="400" fill="#1F2328">1セットで1個</text>
  <rect x="376" y="270" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="398" y="285" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="434" y="305" font-size="24" font-weight="400" fill="#1F2328">パーツごと</text>
  <text x="90" y="376" font-size="26" font-weight="700" fill="#1F2328">色違い・サイズ違い</text>
  <rect x="90" y="394" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="112" y="409" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="148" y="429" font-size="24" font-weight="400" fill="#1F2328">合算する</text>
  <rect x="376" y="394" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="398" y="409" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="434" y="429" font-size="24" font-weight="400" fill="#1F2328">分けて数える</text>
  <text x="90" y="500" font-size="26" font-weight="700" fill="#1F2328">検品前の入荷品</text>
  <rect x="90" y="518" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="112" y="533" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="148" y="553" font-size="24" font-weight="400" fill="#1F2328">届いた時点</text>
  <rect x="376" y="518" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="398" y="533" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="434" y="553" font-size="24" font-weight="400" fill="#1F2328">検品のあと</text>
  <text x="90" y="624" font-size="26" font-weight="700" fill="#1F2328">預け先で紛失中の在庫</text>
  <rect x="90" y="642" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="112" y="657" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="148" y="677" font-size="24" font-weight="400" fill="#1F2328">あると数える</text>
  <rect x="376" y="642" width="254" height="52" rx="26" fill="#FFFFFF" stroke="#A4243B" stroke-width="2.5"/>
  <rect x="398" y="657" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#3D444D" stroke-width="2.5"/>
  <text x="434" y="677" font-size="24" font-weight="400" fill="#1F2328">ないと数える</text>
  <text x="40" y="790" font-size="28" font-weight="700" fill="#A4243B">正解はない。自分の店の答えを1つ決める</text>
</g>
</svg>
