<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-label="上限約500円のうち、広告費に200円使うと約300円が残る。上限の500円を使い切ると、1個売っても残るのは0円。どこまで使うかはROASを見て決める">
<rect width="720" height="580" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="34" font-weight="700" fill="#1F2328">上限約500円のうち、どこまで使うか</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <text x="40" y="166" font-size="28" font-weight="700" fill="#3D444D">広告費に200円使うと</text>
  <rect x="40" y="186" width="256.0" height="60" rx="6" fill="#FBF4F5" stroke="#A4243B" stroke-width="3"/>
  <rect x="296.0" y="186" width="384.0" height="60" rx="6" fill="#3D444D"/>
  <text x="58" y="226" font-size="26" font-weight="700" fill="#A4243B">広告費 200円</text>
  <text x="314.0" y="226" font-size="26" font-weight="700" fill="#FFFFFF">残る 約300円</text>
  <text x="40" y="330" font-size="28" font-weight="700" fill="#3D444D">上限の500円を使い切ると</text>
  <rect x="40" y="350" width="640" height="60" rx="6" fill="#FBF4F5" stroke="#A4243B" stroke-width="3"/>
  <text x="58" y="390" font-size="26" font-weight="700" fill="#A4243B">広告費 500円</text>
  <text x="40" y="458" font-size="28" font-weight="700" fill="#A4243B">1個売っても、残るのは0円</text>
  <line x1="40" y1="500" x2="680" y2="500" stroke="#E4E7EB" stroke-width="2"/>
  <text x="40" y="546" font-size="26" font-weight="700" fill="#1F2328">どこまで使うかは、ROASを見て決める</text>
</g>
</svg>
