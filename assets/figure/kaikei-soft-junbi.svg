<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="会計ソフトを始める前の3ステップ。開業届を出す、青色申告の承認申請をする、事業用の口座とカードを分ける">
<rect width="1200" height="630" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="60" y="80" font-size="42" font-weight="700" fill="#1F2328">会計ソフトを始める前の3ステップ</text>
  <rect x="60" y="104" width="72" height="4" fill="#A4243B"/>

  <!-- 1 -->
  <rect x="60" y="150" width="320" height="380" rx="12" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="220" cy="226" r="40" fill="#A4243B"/>
  <text x="220" y="242" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="220" y="334" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">開業届を</text>
  <text x="220" y="380" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">出す</text>
  <text x="220" y="452" font-size="26" fill="#3D444D" text-anchor="middle">税務署に提出する</text>

  <path d="M394 340h32m-12-16 16 16-16 16" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 -->
  <rect x="440" y="150" width="320" height="380" rx="12" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="600" cy="226" r="40" fill="#A4243B"/>
  <text x="600" y="242" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="600" y="334" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">青色申告の</text>
  <text x="600" y="380" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">承認申請をする</text>
  <text x="600" y="452" font-size="26" fill="#3D444D" text-anchor="middle">提出期限があるので</text>
  <text x="600" y="490" font-size="26" fill="#3D444D" text-anchor="middle">早めに出す</text>

  <path d="M774 340h32m-12-16 16 16-16 16" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <rect x="820" y="150" width="320" height="380" rx="12" fill="#F4F5F6" stroke="#E4E7EB" stroke-width="2"/>
  <circle cx="980" cy="226" r="40" fill="#A4243B"/>
  <text x="980" y="242" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="980" y="334" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">口座とカードを</text>
  <text x="980" y="380" font-size="36" font-weight="700" fill="#1F2328" text-anchor="middle">分ける</text>
  <text x="980" y="452" font-size="26" fill="#3D444D" text-anchor="middle">事業専用を用意して</text>
  <text x="980" y="490" font-size="26" fill="#3D444D" text-anchor="middle">会計ソフトに連携</text>

  <text x="60" y="586" font-size="25" fill="#656C76">提出期限や手続きの詳細は、国税庁のサイトや最寄りの税務署で確認</text>
</g>
</svg>
