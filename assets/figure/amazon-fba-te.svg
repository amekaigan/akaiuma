<svg xmlns="http://www.w3.org/2000/svg" width="720" height="664" viewBox="0 0 720 664" role="img" aria-label="FBAで手から離れる作業は、受注処理、入金処理、ピッキング・梱包、出荷・配送、返品対応・カスタマーサービス。FBAでも自分に残る作業は、預けた在庫がいまいくつあるかの把握">
<rect width="720" height="664" fill="#FFFFFF"/>
<g font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif">
  <text x="40" y="66" font-size="36" font-weight="700" fill="#1F2328">FBAで、手から離れる作業</text>
  <rect x="40" y="88" width="56" height="5" fill="#A4243B"/>
  <rect x="40" y="120" width="640" height="326" rx="12" fill="#FBF4F5"/>
  <path d="M72 162 l9 9 17 -19" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="176" font-size="28" font-weight="700" fill="#1F2328">受注処理</text>
  <path d="M72 220 l9 9 17 -19" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="234" font-size="28" font-weight="700" fill="#1F2328">入金処理</text>
  <path d="M72 278 l9 9 17 -19" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="292" font-size="28" font-weight="700" fill="#1F2328">ピッキング・梱包</text>
  <path d="M72 336 l9 9 17 -19" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="350" font-size="28" font-weight="700" fill="#1F2328">出荷・配送</text>
  <path d="M72 394 l9 9 17 -19" fill="none" stroke="#A4243B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="408" font-size="28" font-weight="700" fill="#1F2328">返品対応・カスタマーサービス</text>
  <rect x="40" y="474" width="640" height="150" rx="12" fill="#F4F5F6" stroke="#656C76" stroke-width="3"/>
  <text x="72" y="526" font-size="28" font-weight="700" fill="#3D444D">FBAでも自分に残る作業</text>
  <text x="72" y="570" font-size="26" font-weight="400" fill="#1F2328">預けた在庫が、いまいくつあるかの把握</text>
  <text x="72" y="604" font-size="24" font-weight="400" fill="#656C76">（預けたあとも自分で追い続ける）</text>
</g>
</svg>
